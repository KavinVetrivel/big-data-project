services:

  neo4j:
    image: neo4j:latest
    container_name: campus-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  mongo:
    image: mongo:latest
    container_name: campus-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  neo4j_data:
  neo4j_logs:
  mongo_data: